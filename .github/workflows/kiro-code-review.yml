name: Kiro Code Review

on:
  pull_request:
    branches: [kiro-headless]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Run Kiro code review
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          TERM: dumb
          KIRO_LOG_NO_COLOR: "1"
        run: |
          kiro-cli --classic chat \
            --agent code-reviewer \
            --no-interactive \
            --trust-tools=read,grep,glob,code \
            "Review the code in this repository." > /tmp/review-output.txt 2>&1

      - name: Post review as PR comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let output = fs.readFileSync('/tmp/review-output.txt', 'utf8');

            // Remove any residual ANSI codes and control characters
            output = output.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');
            output = output.replace(/\x1b\[\?[0-9]*[a-zA-Z]/g, '');
            output = output.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
            output = output.replace(/[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏].*Loading\.\.\..*/g, '');

            // Extract just the review content
            const reviewStart = output.indexOf('# Code Review');
            if (reviewStart !== -1) {
              output = output.substring(reviewStart);
            }

            // Re-wrap code blocks: CLI strips triple backticks, leaving bare language names
            const langs = ['javascript', 'typescript', 'jsx', 'tsx', 'hcl', 'json', 'bash', 'python', 'yaml', 'shell', 'tf'];
            const lines = output.split('\n');
            const result = [];
            let inCodeBlock = false;

            for (let i = 0; i < lines.length; i++) {
              const trimmed = lines[i].trim();

              if (!inCodeBlock && langs.includes(trimmed)) {
                // Check next line exists and looks like code (not a heading or empty)
                const nextLine = (lines[i + 1] || '').trim();
                if (nextLine && !nextLine.startsWith('#') && !nextLine.startsWith('━')) {
                  result.push('```' + trimmed);
                  inCodeBlock = true;
                  continue;
                }
              }

              if (inCodeBlock) {
                // Close before headings, horizontal rules, "Why/Recommendation" lines, or double blank
                if (/^(#{1,4} |━|Why this matters|Recommendation|Even for|File:)/.test(trimmed) ||
                    (trimmed === '' && (lines[i + 1] || '').trim().startsWith('#')) ||
                    (trimmed === '' && (lines[i + 1] || '').trim().startsWith('━')) ||
                    (trimmed === '' && /^(Why|Recommendation|Even|File:)/.test((lines[i + 1] || '').trim()))) {
                  result.push('```');
                  result.push('');
                  inCodeBlock = false;
                }
              }

              result.push(lines[i]);
            }

            if (inCodeBlock) result.push('```');
            output = result.join('\n');

            // Clean up multiple consecutive blank lines
            output = output.replace(/\n{3,}/g, '\n\n');

            // Trim to GitHub comment size limit
            if (output.length > 60000) {
              output = output.substring(0, 60000) + '\n\n... (truncated)';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: output
            });
