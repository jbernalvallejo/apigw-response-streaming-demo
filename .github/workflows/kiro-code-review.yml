name: Kiro Code Review

on:
  pull_request:
    branches: [kiro-headless]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Run Kiro code review
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          kiro-cli chat \
            --agent code-reviewer \
            --no-interactive \
            --trust-tools=read,grep,glob,code \
            "Review the code in this repository." 2>&1 | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' | sed 's/\x1b\[[?][0-9]*[a-zA-Z]//g' | tr -d '\r' > /tmp/review-output.txt

      - name: Post review as PR comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let output = fs.readFileSync('/tmp/review-output.txt', 'utf8');

            // Remove remaining control characters and spinner artifacts
            output = output.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
            output = output.replace(/[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏].*Loading\.\.\..*/g, '');
            output = output.replace(/^\s*$/gm, '');

            // Extract just the review content (after the agent starts responding)
            const reviewStart = output.indexOf('# Code Review');
            if (reviewStart !== -1) {
              output = output.substring(reviewStart);
            }

            // Clean up multiple consecutive blank lines
            output = output.replace(/\n{3,}/g, '\n\n');

            // Trim to GitHub comment size limit
            if (output.length > 60000) {
              output = output.substring(0, 60000) + '\n\n... (truncated)';
            }

            const body = `## 🔍 Kiro Code Review\n\n${output}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
